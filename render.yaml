services:
  - type: web
    name: procurement-tracker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL      # your Neon connection string
        sync: false
      - key: APP_USER          # login name you choose
        sync: false
      - key: APP_PASSWORD      # password you choose
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.3
